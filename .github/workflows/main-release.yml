name: Build and release main APK

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-apk-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_FILE: /tmp/motion-release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Main builds bump only PATCH of the latest vX.Y.Z tag. Major/minor are set by pushing a vX.Y.Z tag
      # manually, which builds and releases exactly that version.
      - name: Compute semantic version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            LAST_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${LAST_TAG#v}"
          else
            LAST_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG:-v1.0.0}"
            VERSION="${MAJOR#v}.$MINOR.$((PATCH + 1))"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="$VERSION-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          fi
          echo "Building version $VERSION (previous tag: ${LAST_TAG:-none})"
          {
            echo "APP_VERSION=$VERSION"
            echo "ORG_GRADLE_PROJECT_appVersionName=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Create pull request signing key
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair \
            -noprompt \
            -keystore "$RELEASE_STORE_FILE" \
            -storetype PKCS12 \
            -storepass ci-validation \
            -keypass ci-validation \
            -alias ci-validation \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI Validation, O=Motion"
          {
            echo "RELEASE_STORE_PASSWORD=ci-validation"
            echo "RELEASE_KEY_ALIAS=ci-validation"
            echo "RELEASE_KEY_PASSWORD=ci-validation"
          } >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/renamedApks/release/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motion-${{ env.APP_VERSION }}
          path: app/build/renamedApks/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.APP_VERSION }}
        run: >-
          gh release create "$RELEASE_TAG"
          app/build/renamedApks/release/*.apk
          --target "$GITHUB_SHA"
          --title "Motion $RELEASE_TAG"
          --generate-notes
